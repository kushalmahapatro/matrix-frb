# If downloads fail with "Connect to 127.0.0.1:9090 ... Connection refused", a stale HTTP proxy is set
# (IDE, shell env, or macOS system proxy). These flags force direct connections for this project only.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.useSystemProxies=false -Dhttp.proxyHost= -Dhttps.proxyHost= -Dhttp.proxyPort= -Dhttps.proxyPort=
android.useAndroidX=true
android.enableJetifier=true
