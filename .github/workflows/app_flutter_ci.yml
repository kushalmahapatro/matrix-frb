name: App Flutter CI

on:
  push:
    paths:
      - "app/**"
      - "sdk/lib/**"
      - ".github/workflows/app_flutter_ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "sdk/lib/**"
      - ".github/workflows/app_flutter_ci.yml"

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --no-pub

  integration-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test integration_test/call_flow_test.dart -d macos --no-pub
