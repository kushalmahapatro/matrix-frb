name: matrix_sdk
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '^3.10.0'

dev_dependencies:
  build_runner: ^2.4.7
  ffigen: ^20.1.0
  freezed: ^3.1.0
  json_serializable: ^6.7.1
  test: ^1.16.0

dependencies:
  archive: ^4.0.7
  code_assets: ^1.0.0
  ffi: ^2.1.4
  flutter_rust_bridge: ^2.11.1
  http_profile: ^0.1.0
  logging: ^1.3.0
  path: ^1.9.1
  hooks: ^1.0.2
  native_toolchain_rust: ^1.0.3
  freezed_annotation: ^3.1.0
  path_provider: ^2.1.5
  media:
    git:
      url: https://github.com/kushalmahapatro/media-rs.git
      ref: 6a56ba80124b4a1673e8a7767532f088aa64ea1e

# Same workspace packages as app — see app/pubspec.yaml.
# media_native_build (via media_dart) allows archive ^3.6.1; matrix_sdk uses ^4 — unify for the solver.
dependency_overrides:
  archive: ^4.0.7
  media_dart:
    git:
      url: https://github.com/kushalmahapatro/media-rs.git
      ref: 6a56ba80124b4a1673e8a7767532f088aa64ea1e
      path: media_dart
  media_flutter:
    git:
      url: https://github.com/kushalmahapatro/media-rs.git
      ref: 6a56ba80124b4a1673e8a7767532f088aa64ea1e
      path: media_flutter

flutter:
  assets:
    - .matrix-sdk/native/pdfium/lib/

hooks:
  user_defines:
    media:
      localBuild: false
