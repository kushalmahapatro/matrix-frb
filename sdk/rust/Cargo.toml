[package]
name = "matrix"
version = "0.1.0"
edition = "2021"

rust-version = "1.93"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"

# Matrix Rust SDK from submodule (https://github.com/kushalmahapatro/matrix-rust-sdk)
# matrix-sdk = { path = "matrix-rust-sdk/crates/matrix-sdk" }
# matrix-sdk-sqlite = { path = "matrix-rust-sdk/crates/matrix-sdk-sqlite", features = [
#   "bundled-sqlcipher-vendored-openssl",
# ] }
# matrix-sdk-ui = { path = "matrix-rust-sdk/crates/matrix-sdk-ui" }
# matrix-sdk-common = { path = "matrix-rust-sdk/crates/matrix-sdk-common" }
matrix-sdk = { git = "https://github.com/kushalmahapatro/matrix-rust-sdk.git", branch = "feat/dart-support-1" }
matrix-sdk-sqlite = { git = "https://github.com/kushalmahapatro/matrix-rust-sdk.git", branch = "feat/dart-support-1", features = [
  "bundled-sqlcipher-vendored-openssl",
] }
matrix-sdk-ui = { git = "https://github.com/kushalmahapatro/matrix-rust-sdk.git", branch = "feat/dart-support-1" }
matrix-sdk-common = { git = "https://github.com/kushalmahapatro/matrix-rust-sdk.git", branch = "feat/dart-support-1" }
matrix-sdk-base = { git = "https://github.com/kushalmahapatro/matrix-rust-sdk.git", branch = "feat/dart-support-1" }

# Enables MSC4095 URL previews on `m.text` (`com.beeper.linkpreviews`); unified with matrix-sdk's ruma.
ruma = { git = "https://github.com/ruma/ruma", rev = "2455c71ec8bd16318397865d9c6e231e792cb15e", features = [
    "unstable-msc4095",
    "unstable-msc3245-v1-compat",
] }

tracing = { version = "0.1.40", default-features = false, features = ["std"] }
tracing-core = "0.1.32"


serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
anyhow = "1.0"
url = "2.0"
once_cell = "1.0"
futures = "0.3"
log = "0.4"
# tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
tracing-appender = { version = "0.2.2" }
log-panics = { version = "2", features = ["with-backtrace"] }
paranoid-android = "0.2.1"
sentry = { version = "0.36.0", optional = true, default-features = false, features = [
  # Most default features enabled otherwise.
  "backtrace",
  "contexts",
  "panic",
  "reqwest",
  "sentry-debug-images",
] }
sentry-tracing = { version = "0.36.0", optional = true }
imbl = "7.0.0"
eyeball = { version = "0.8.8", default-features = false, features = ["tracing"] }
eyeball-im = "0.8"

mime = "0.3.17"
mime_guess = "2.0"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
] }
blurhash = "0.2.3"
extension-trait = "1.0.2"
syn = "2.0.104"
quote = "1.0.40"
proc-macro2 = "1.0.95"
# Vendored OpenSSL: embedded with the app so it works on Windows without installing OpenSSL,
# and on all platforms without relying on system OpenSSL version or presence.
openssl = { version = "*", default-features = false, features = ["vendored"] }


# rhttp
async-trait = "0.1"
futures-util = "0.3.31"
chrono = "0.4.42"
# Minimal features for faster builds (was "full" - 300–500s). Enable only what we use: runtime, sync, macros, fs, time.
tokio = { version = "1.48.0", default-features = false, features = [
  "rt-multi-thread",
  "sync",
  "macros",
  "fs",
  "time",
] }
tokio-util = "0.7.17"
calamine = { version = "0.34.0", default-features = false, features = ["dates"] }
zip = { version = "8.3.0", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.39.2", features = ["serialize"] }
pdf-extract = "0.10.0"
csv = { version = "1.4.0", default-features = false }
pdfium-render = { version = "0.8.37", features = ["pdfium_latest"] }
cfb = "0.14"

# Match matrix-sdk-sqlite SQLCipher linkage per platform (same as crypto/state/event_cache).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rusqlite = { version = "0.37.0", default-features = false, features = [
  "bundled-sqlcipher",
  "limits",
] }

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
rusqlite = { version = "0.37.0", default-features = false, features = [
  "bundled-sqlcipher-vendored-openssl",
  "limits",
] }

[dependencies.reqwest]
version = "0.13.1"
default-features = false
features = [
  "charset",
  "cookies",
  "http2",
  "stream",
  "multipart",
  "query",
  "form",
  "socks",
  "native-tls",
  # Compression
  "brotli",
  "gzip",
]

# macOS & Linux: SQLCipher with system OpenSSL (smaller binary, faster build).
[target.'cfg(target_os = "macos")'.dependencies]
# matrix-sdk-sqlite = { path = "matrix-rust-sdk/crates/matrix-sdk-sqlite", features = [
#   "bundled-sqlcipher",
# ] }
matrix-sdk-sqlite = { git = "https://github.com/kushalmahapatro/matrix-rust-sdk.git", branch = "feat/dart-support-1", features = [
  "bundled-sqlcipher",
] }

[target.'cfg(target_os = "linux")'.dependencies]
matrix-sdk-sqlite = { git = "https://github.com/kushalmahapatro/matrix-rust-sdk.git", branch = "feat/dart-support-1", features = [
  "bundled-sqlcipher",
] } # matrix-sdk-sqlite = { path = "matrix-rust-sdk/crates/matrix-sdk-sqlite", features = [
#   "bundled-sqlcipher",
# ] }

# Android: SQLCipher + vendored OpenSSL (from default); android_logger; rustls platform verifier init.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
rustls-platform-verifier = { version = "0.6", default-features = false }
jni = { version = "0.21", default-features = false }

[features]
default = []
rhttp-client = []
sentry = ["dep:sentry", "sentry-tracing"]
sentry-tracing = ["dep:sentry-tracing"]
js = []


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }


[profile.release]
opt-level = 3
strip = true
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
# Fast compile (was opt-level = 3). Use --release for production; use dev for quick iteration.
opt-level = 0
debug = true
panic = "abort"
incremental = true


[patch.crates-io]
async-compat = { git = "https://github.com/element-hq/async-compat", rev = "5a27c8b290f1f1dcfc0c4ec22c464e38528aa591" }
const_panic = { git = "https://github.com/jplatte/const_panic", rev = "9024a4cb3eac45c1d2d980f17aaee287b17be498" }
# Needed to fix rotation log issue on Android (https://github.com/tokio-rs/tracing/issues/2937)
tracing = { git = "https://github.com/tokio-rs/tracing.git", rev = "20f5b3d8ba057ca9c4ae00ad30dda3dce8a71c05" }
tracing-core = { git = "https://github.com/tokio-rs/tracing.git", rev = "20f5b3d8ba057ca9c4ae00ad30dda3dce8a71c05" }
tracing-subscriber = { git = "https://github.com/tokio-rs/tracing.git", rev = "20f5b3d8ba057ca9c4ae00ad30dda3dce8a71c05" }
tracing-appender = { git = "https://github.com/tokio-rs/tracing.git", rev = "20f5b3d8ba057ca9c4ae00ad30dda3dce8a71c05" }
