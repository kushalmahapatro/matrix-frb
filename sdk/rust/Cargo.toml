[package]
name = "matrix"
version = "0.1.0"
edition = "2021"
build = "build.rs"
rust-version = "1.93"

[build-dependencies]
# Android: retain/export `Java_livekit_org_webrtc_*` from `libwebrtc.a` in the final `libmatrix.so`.
webrtc-sys-build = "0.3.15"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"

# Matrix Rust SDK from submodule (https://github.com/kushalmahapatro/matrix-rust-sdk)
# matrix-sdk = { path = "matrix-rust-sdk/crates/matrix-sdk" }
# matrix-sdk-sqlite = { path = "matrix-rust-sdk/crates/matrix-sdk-sqlite", features = [
#   "bundled-sqlcipher-vendored-openssl",
# ] }
# matrix-sdk-ui = { path = "matrix-rust-sdk/crates/matrix-sdk-ui" }
# matrix-sdk-common = { path = "matrix-rust-sdk/crates/matrix-sdk-common" }
matrix-sdk = { git = "https://github.com/kushalmahapatro/matrix-rust-sdk.git", branch = "feat/dart-support-1", features = [
  "experimental-widgets",
] }
# SQLCipher: use system OpenSSL on Apple/Linux (incl. iOS Simulator/device). Vendored OpenSSL is
# Android-only — a global `bundled-sqlcipher-vendored-openssl` unifies into iOS and can corrupt
# WebRTC/BoringSSL (DTLS cert gen crash in bssl::Vector / BN_div).
matrix-sdk-sqlite = { git = "https://github.com/kushalmahapatro/matrix-rust-sdk.git", branch = "feat/dart-support-1", features = [
  "bundled-sqlcipher",
] }
matrix-sdk-ui = { git = "https://github.com/kushalmahapatro/matrix-rust-sdk.git", branch = "feat/dart-support-1" }
matrix-sdk-common = { git = "https://github.com/kushalmahapatro/matrix-rust-sdk.git", branch = "feat/dart-support-1" }
matrix-sdk-base = { git = "https://github.com/kushalmahapatro/matrix-rust-sdk.git", branch = "feat/dart-support-1" }

# Enables MSC4095 URL previews on `m.text` (`com.beeper.linkpreviews`); unified with matrix-sdk's ruma.
ruma = { git = "https://github.com/ruma/ruma", rev = "2455c71ec8bd16318397865d9c6e231e792cb15e", features = [
  "unstable-msc4075",
  "unstable-msc4095",
  "unstable-msc3245-v1-compat",
] }

tracing = { version = "0.1.40", default-features = false, features = ["std"] }
tracing-core = "0.1.32"


serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
anyhow = "1.0"
url = "2.0"
language-tags = "0.3.2"
once_cell = "1.0"
futures = "0.3"
log = "0.4"
# tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
tracing-appender = { version = "0.2.2" }
log-panics = { version = "2", features = ["with-backtrace"] }
paranoid-android = "0.2.1"
sentry = { version = "0.36.0", optional = true, default-features = false, features = [
  # Most default features enabled otherwise.
  "backtrace",
  "contexts",
  "panic",
  "reqwest",
  "sentry-debug-images",
] }
sentry-tracing = { version = "0.36.0", optional = true }
imbl = "7.0.0"
eyeball = { version = "0.8.8", default-features = false, features = [
  "tracing",
] }
eyeball-im = "0.8"

mime = "0.3.17"
mime_guess = "2.0"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
  "gif",
] }
blurhash = "0.2.3"
extension-trait = "1.0.2"
syn = "2.0.104"
quote = "1.0.40"
proc-macro2 = "1.0.95"
# rhttp
async-trait = "0.1"
futures-util = "0.3.31"
chrono = "0.4.42"
# Minimal features for faster builds (was "full" - 300–500s). Enable only what we use: runtime, sync, macros, fs, time.
tokio = { version = "1.48.0", default-features = false, features = [
  "rt-multi-thread",
  "sync",
  "macros",
  "fs",
  "time",
] }
tokio-util = "0.7.17"
calamine = { version = "0.34.0", default-features = false, features = [
  "dates",
] }
zip = { version = "8.3.0", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.39.2", features = ["serialize"] }
pdf-extract = "0.10.0"
csv = { version = "1.4.0", default-features = false }
pdfium-render = { version = "0.8.37", features = ["pdfium_latest"] }
cfb = "0.14"

# Match matrix-sdk-sqlite SQLCipher linkage per platform (same as crypto/state/event_cache).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rusqlite = { version = "0.37.0", default-features = false, features = [
  "bundled-sqlcipher",
  "limits",
] }

# Android & other non-desktop (non-iOS): SQLCipher + vendored OpenSSL for rusqlite. Android also
# gets `matrix-sdk-sqlite` with `bundled-sqlcipher-vendored-openssl` under `[target.'cfg(target_os = "android")']`.
# iOS is excluded: avoid a second vendored OpenSSL in the same binary as WebRTC/BoringSSL (see root comment).
[target.'cfg(not(any(target_os = "macos", target_os = "linux", target_os = "ios")))'.dependencies]
rusqlite = { version = "0.37.0", default-features = false, features = [
  "bundled-sqlcipher-vendored-openssl",
  "limits",
] }

[dependencies.reqwest]
version = "0.13.1"
default-features = false
features = [
  "charset",
  "cookies",
  "http2",
  "stream",
  "multipart",
  "query",
  "form",
  "socks",
  "native-tls",
  # Compression
  "brotli",
  "gzip",
]

# macOS & Linux: root `matrix-sdk-sqlite` already uses `bundled-sqlcipher` (system OpenSSL).

# Android: SQLCipher + vendored OpenSSL (cross-compile); android_logger; rustls platform verifier init.
[target.'cfg(target_os = "android")'.dependencies]
matrix-sdk-sqlite = { git = "https://github.com/kushalmahapatro/matrix-rust-sdk.git", branch = "feat/dart-support-1", features = [
  "bundled-sqlcipher-vendored-openssl",
] }
android_logger = "0.15.1"
rustls-platform-verifier = { version = "0.6", default-features = false }
jni = { version = "0.21", default-features = false }

# LiveKit + libwebrtc do not support wasm32; keep off the wasm matrix build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
livekit = { version = "0.7.36", default-features = false, features = [
  "tokio",
  "native-tls",
] }

[features]
default = []
rhttp-client = []
sentry = ["dep:sentry", "sentry-tracing"]
sentry-tracing = ["dep:sentry-tracing"]
js = []


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }


[profile.release]
opt-level = 3
strip = true
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
# Fast compile (was opt-level = 3). Use --release for production; use dev for quick iteration.
opt-level = 0
debug = true
panic = "abort"
incremental = true


[patch.crates-io]
# Patched webrtc-sys: android __sF fix; Android libwebrtc.a BoringSSL symbol prefix (see patches/webrtc-sys/build.rs).
webrtc-sys = { path = "patches/webrtc-sys" }
